# Niche Research Engine inputs.
#
# seeds: search terms used for measured factors (Wikipedia pageviews / search
#        hit counts, Commons and NASA media counts, legal-source pass rates,
#        YouTube search counts). Measured values are labelled FACT or ESTIMATE
#        in the report, each with its method and date.
# priors: factors that cannot be measured from public APIs. These are
#        ASSUMPTIONS (1 = low, 5 = high) — starting values chosen by the
#        developer, NOT data. Replace them with your own judgement; the report
#        always labels them ASSUMPTION.
niches:
  history:
    seeds: [World War II, Roman Empire, Industrial Revolution, Ancient Egypt]
    priors: {sponsorship_potential: 3, fact_checking_difficulty: 3, originality_potential: 4, production_difficulty: 3}
  science:
    seeds: [Physics, Chemistry, Cellular automaton, Periodic table]
    priors: {sponsorship_potential: 3, fact_checking_difficulty: 3, originality_potential: 4, production_difficulty: 3}
  technology:
    seeds: [Transistor, Internet, Artificial intelligence, Semiconductor]
    priors: {sponsorship_potential: 5, fact_checking_difficulty: 3, originality_potential: 3, production_difficulty: 2}
  business:
    seeds: [Stock market, Supply chain, Inflation, Startup company]
    priors: {sponsorship_potential: 5, fact_checking_difficulty: 4, originality_potential: 3, production_difficulty: 2}
  psychology:
