# Caption styles live apart from the renderer. Coordinates assume the
# configured video resolution; margins are in pixels.
# YouTube's Shorts UI covers roughly the bottom ~20% (title/channel) and a
# strip on the right (buttons), so captions sit above that zone by default.

bold_center:
  font: DejaVu Sans
  font_file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  font_size: 86
  bold: true
  primary_color: "#FFFFFF"
  highlight_color: "#FFD23F"     # active word
  outline_color: "#000000"
  outline_width: 6
  shadow: 2
  margin_v: 620                  # distance from bottom edge
  margin_lr: 110
  max_words_per_chunk: 3
  max_chars_per_chunk: 18
  min_chunk_seconds: 0.35
  uppercase: false
  word_highlight: true

clean_lower:
  font: Liberation Sans
  font_file: /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
  font_size: 72
  bold: true
  primary_color: "#FFFFFF"
  highlight_color: "#7FDBFF"
  outline_color: "#101010"
  outline_width: 5
  shadow: 0
  margin_v: 520
  margin_lr: 120
  max_words_per_chunk: 4
  max_chars_per_chunk: 24
  min_chunk_seconds: 0.4
  uppercase: false
  word_highlight: false

boxed_upper:
  font: DejaVu Sans
  font_file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  font_size: 78
  bold: true
  primary_color: "#FFFFFF"
  highlight_color: "#FF6B6B"
  outline_color: "#000000"
  outline_width: 0
  box: true
  box_color: "#000000B0"
  shadow: 0
  margin_v: 640
  margin_lr: 110
  max_words_per_chunk: 3
  max_chars_per_chunk: 16
  min_chunk_seconds: 0.35
  uppercase: true
  word_highlight: true
