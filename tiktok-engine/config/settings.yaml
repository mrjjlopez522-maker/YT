# TikTok Engine configuration. Secrets never go here — use .env (see .env.example).
# DRY_RUN, AUTO_PUBLISH and MANUAL_APPROVAL defaults are also enforced in code.

channel:
  id: tiktok-main
  name: "Studio Demo"              # set your channel name (also in brand.yaml)
  niche: undecided                 # choose after `python main.py niches`
  language: en

brand_file: config/brand.yaml
series_file: config/series.yaml
formats_file: config/formats.yaml

production:
  target_duration: 65              # Creator Rewards counts only videos >= 60 s (docs/BUSINESS_RESEARCH.md)
  allowed_durations: [15, 20, 30, 45, 60, 65, 90, 120, 180]
  duration_tolerance: 0.2
  max_duration: 180
  video_resolution: [1080, 1920]
  fps: 30
  posting_frequency: daily         # kept for the core library; the calendar below is authoritative
  max_daily_videos: 2
  allow_graphics_only: true
  x264_preset: medium
  x264_crf: 19
  video_maxrate: 12M
  audio_bitrate: 192k

calendar:
  videos_per_day: 1
  days_per_week: 5
  publishing_windows: ["12:00-13:00", "18:00-21:00"]   # local time, your choice
  timezone: UTC
  skip_when_quality_fails: true    # never force a slot with a video that failed QC

voice:
  provider: kokoro                 # kokoro (local, natural) | espeak (local, robotic) | elevenlabs (TTS_API_KEY)
  voice_name: am_michael           # kokoro voices: see `python main.py voice --list`
  speed: 1.1                       # kokoro speed multiplier (measured 155-165 wpm; `voice --calibrate` re-measures)
  words_per_minute: 155            # fallback only: scripts budget with the voice's measured rate (calibrated once)
  pitch: 50                        # espeak only
  sentence_pause_ms: 260
  section_pause_ms: 420
  hook_pitch_delta: 0
  pronunciation_file: config/pronunciations.yaml
  models_dir: models

captions:
  style: tiktok_bold
  styles_file: config/caption_styles.yaml

music:
  policy: licensed_library_only    # none | licensed_library_only (original generated beds count as licensed: CC0, ours)
  library_dir: sources/music
  duck_db: 16
  generate_original_bed: true

sfx:
  enabled: true                    # subtle whooshes at section changes only
  library_dir: sources/sfx

audio:
  target_lufs: -14.0
  true_peak_db: -1.5
  loudness_tolerance_lu: 2.0

source_policy:
  allowed_licenses: [PD, PD-USGov, CC0-1.0, CC-BY-4.0, CC-BY-3.0, CC-BY-2.5, CC-BY-2.0, STOCK-LICENSED, USER-OWNED, WRITTEN-PERMISSION]
  allow_share_alike: false
  min_rights_confidence: 0.85
  use_source_audio: false
  max_continuous_source_seconds: 6.0
  max_source_screen_ratio: 0.85    # third-party footage only; original generated visuals don't count
  providers: [local_library]       # add wikimedia_commons, nasa_images, internet_archive with network access
  max_results_per_provider: 8

research:
  providers: [local_notes, wikipedia]
  notes_dir: research/notes
  min_facts: 6
  min_independent_sources: 2

trends:
  providers: [observations, manual, wikipedia_pageviews, rss]
  observations_file: config/trend_observations.yaml
  manual_file: config/topic_ideas.yaml
  rss_feeds: []
  wikipedia_project: en.wikipedia
  youtube_region: US
  default_expiry_days: 14

ideas:
  batch_size: 20
  shortlist: 5
  produce: 2

content:
  llm_provider: offline            # offline | anthropic
  anthropic_model: claude-opus-5-5
  include_cta: false               # comment prompts are generated separately and optional
  max_ngram_overlap: 7
  style_file: config/style.yaml

factcheck:
  min_sources_for_verified: 1
  allow_needs_review_claims: false
  drop_unverified_claims: true

qc:
  similarity_threshold: 0.80
  max_silence_seconds: 1.0
  max_black_seconds: 0.3
  min_narration_coverage: 0.85
  max_hook_seconds: 3.6
  min_visual_changes_per_10s: 1.2
  max_single_visual_share: 0.5
  caption_safe_zone: {min_margin_v: 520, min_margin_lr: 110, min_font_size: 60}

publishing:
  manual_approval: true
  auto_upload: false
  auto_publish: false
  dry_run: true
  default_privacy: private         # core-library setting; TikTok privacy is chosen explicitly at publish time
  tiktok_mode: draft               # draft (Upload API -> creator's inbox) | direct (Direct Post API)
  disclose_synthetic_voice: true   # adds a short disclosure to the caption
  contains_synthetic_media: false
  made_for_kids: false
  category_id: "27"
  playlist_id: ""
  max_caption_chars: 2200

costs:
  max_api_cost_per_video: 1.00
  pricing_file: config/pricing.yaml

experiments:
  min_sample_size_per_variant: 10

logging:
  level: INFO
